<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexora AI Marketing — Customer Access</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#030711;color:#fff;font-family:Arial,sans-serif}.box{width:min(92%,430px);background:#07182a;border:1px solid #1b4964;border-radius:22px;padding:28px}.brand{font-weight:900;letter-spacing:2px}.brand span{color:#55e5ff}h1{margin-bottom:6px}.sub{color:#8da4b8;font-size:13px;line-height:1.5}label{display:block;color:#70dcf4;font-size:10px;letter-spacing:1px;margin:16px 0 6px}input{width:100%;padding:13px;border-radius:9px;border:1px solid #24516c;background:#020b15;color:#fff}.btn{width:100%;margin-top:18px;border:0;border-radius:10px;padding:14px;font-weight:900;color:#fff;background:linear-gradient(135deg,#176cff,#00c7ff);cursor:pointer}.tabs{display:flex;gap:8px;margin:22px 0}.tabs button{flex:1;padding:10px;border-radius:9px;border:1px solid #21465f;background:#081321;color:#9bb3c7;cursor:pointer}.tabs .on{background:#10334c;color:#fff}.notice{font-size:10px;color:#7890a5;margin-top:15px;line-height:1.5}</style></head><body><div class="box"><div class="brand">NEXORA <span>AI MARKETING</span></div><h1>Customer Workspace</h1><p class="sub">Create your workspace to prepare campaigns, connect approved ad accounts and manage Nexora marketing execution.</p><div class="tabs"><button id="signupTab" class="on" type="button">Create account</button><button id="loginTab" type="button">Sign in</button></div><label>NAME / BUSINESS</label><input id="name" placeholder="Business name"><label>EMAIL</label><input id="email" type="email" placeholder="you@company.com"><label>PASSWORD</label><input id="password" type="password" placeholder="Password"><button class="btn" id="go" type="button">CREATE ACCOUNT</button><div class="notice">Secure signup uses the Nexora backend. Passwords are stored only as one-way hashes.</div></div><script>let m='signup';const signupTab=document.getElementById('signupTab'),loginTab=document.getElementById('loginTab'),go=document.getElementById('go'),nameInput=document.getElementById('name'),emailInput=document.getElementById('email'),passwordInput=document.getElementById('password');signupTab.addEventListener('click',()=>mode('signup'));loginTab.addEventListener('click',()=>mode('login'));go.addEventListener('click',submitForm);function mode(x){m=x;signupTab.className=x==='signup'?'on':'';loginTab.className=x==='login'?'on':'';go.textContent=x==='signup'?'CREATE ACCOUNT':'SIGN IN'}async function submitForm(){let n=nameInput.value.trim(),e=emailInput.value.trim(),p=passwordInput.value;if(m!=='signup'){try {
  const response = await fetch('/api/signin', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify({ email: e, password: p })
  });

  const data = await response.json();

  if (!response.ok) {
    alert(data.error || 'Sign in failed.');
    return;
  }

  sessionStorage.setItem('nexoraUser', JSON.stringify(data.user));
  window.location.href = 'dashboard.html';
} catch (error) {
  alert('Sign in is temporarily unavailable.');
}

return;}if(!n||!e||p.length<8){alert('Enter business/name, valid email and password of at least 8 characters.');return}go.disabled=true;go.textContent='CREATING...';try{let r=await fetch('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n,email:e,password:p})});let d=await r.json();if(!r.ok){alert(d.error||'Signup failed');return}sessionStorage.setItem('nexoraUser',JSON.stringify(d.user));alert('Account created successfully.');location.href='dashboard.html'}catch(e){alert('Signup is temporarily unavailable.')}finally{go.disabled=false;go.textContent='CREATE ACCOUNT'}}</script></body></html>
